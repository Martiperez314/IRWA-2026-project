{% extends "base.html" %}
{% block page_title %}{{ page_title }}{% endblock %}
{% block content %}
    <div class="home">
        <h1 class="home-title">Find fashion products</h1>
        <p class="home-sub">28,080 products: clothing, footwear and accessories.</p>
        <form class="search-form" method="GET" action="{{ url_for('search') }}" role="search">
            <input class="form-control search-input" name="q" type="search" placeholder="e.g. women cotton printed kurta"
                   aria-label="Search" autofocus required maxlength="200">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <div class="examples">
            <span>Try:</span>
            {% for q in examples %}
                <a class="chip" href="{{ url_for('search', q=q) }}">{{ q }}</a>
            {% endfor %}
        </div>
    </div>
{% endblock %}
